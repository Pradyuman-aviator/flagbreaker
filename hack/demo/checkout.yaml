# The demo workload and how it is guarded. hack/demo/up.sh fills in
# __ENVIRONMENT_KEY__ (the Production environment's client-side key).
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  annotations:
    # Set by a cluster admin: FlagGuards in this namespace may act on the
    # Production environment, and on no other.
    flagbreaker.dev/allowed-environments: "__ENVIRONMENT_KEY__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
  annotations:
    # The one-line way to guard flags: Flagbreaker creates the FlagGuards
    # checkout-express-checkout and checkout-checkout-config from this, in
    # the controller's default Flagsmith environment.
    flagbreaker.dev/flags: "express_checkout,checkout_config"
    flagbreaker.dev/stable-for: "20s"
    flagbreaker.dev/runbook-url: "https://github.com/Pradyuman-aviator/flagbreaker/blob/main/docs/runbook.md"
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
        - name: checkout
          image: checkout-demo:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: FLAGSMITH_URL, value: "http://flagsmith-api.flagsmith:8000"}
            - {name: FLAGSMITH_ENVIRONMENT_KEY, value: "__ENVIRONMENT_KEY__"}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
---
# The shop's page, on http://localhost:8090 (APP_PORT) through the kind
# cluster's port mapping. It answers only while a checkout pod is ready.
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shop
spec:
  type: NodePort
  selector: {app: checkout}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30082
---
# The full form, with every setting in reach: which flag the workload depends
# on, in which Flagsmith environment, and when to trip.
apiVersion: flagbreaker.dev/v1alpha1
kind: FlagGuard
metadata:
  name: checkout-new-pricing
  namespace: shop
spec:
  flag: new_pricing
  environmentKey: "__ENVIRONMENT_KEY__"
  workload:
    kind: Deployment
    name: checkout
  stableFor: 20s
  links:
    - title: Runbook
      url: https://github.com/Pradyuman-aviator/flagbreaker/blob/main/docs/runbook.md
