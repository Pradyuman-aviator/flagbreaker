# The demo workload and how it is guarded. hack/demo/up.sh fills in
# __ENVIRONMENT_KEY__ (the Production environment's client-side key) and
# __APP_IMAGE_ID__ (the ID of the checkout-demo:dev image it built).
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  annotations:
    # Set by a cluster admin: FlagGuards in this namespace may act on the
    # Production environment, and on no other.
    flagbreaker.dev/allowed-environments: "__ENVIRONMENT_KEY__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
  annotations:
    # The one-line way to guard flags: Flagbreaker creates the FlagGuards
    # checkout-express-checkout and checkout-checkout-config from this, in
    # the controller's default Flagsmith environment.
    flagbreaker.dev/flags: "express_checkout,checkout_config"
    flagbreaker.dev/stable-for: "20s"
    flagbreaker.dev/runbook-url: "https://github.com/Pradyuman-aviator/flagbreaker/blob/main/docs/runbook.md"
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
      annotations:
        # Rolls the pods when up.sh rebuilt the app: the tag stays dev.
        demo.flagbreaker.dev/image-id: "__APP_IMAGE_ID__"
    spec:
      containers:
        - name: checkout
          image: checkout-demo:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: FLAGSMITH_URL, value: "http://flagsmith-api.flagsmith:8000"}
            - {name: FLAGSMITH_ENVIRONMENT_KEY, value: "__ENVIRONMENT_KEY__"}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
---
# The shop's page, on http://localhost:8090 (APP_PORT) through the kind
# cluster's port mapping. It answers only while a checkout pod is ready.
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shop
spec:
  type: NodePort
  selector: {app: checkout}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30082
---
# The full form, with every setting in reach: which flag the workload depends
# on, in which Flagsmith environment, and when to trip.
apiVersion: flagbreaker.dev/v1alpha1
kind: FlagGuard
metadata:
  name: checkout-new-pricing
  namespace: shop
spec:
  flag: new_pricing
  environmentKey: "__ENVIRONMENT_KEY__"
  workload:
    kind: Deployment
    name: checkout
  stableFor: 20s
  links:
    - title: Runbook
      url: https://github.com/Pradyuman-aviator/flagbreaker/blob/main/docs/runbook.md
---
# The demo's shoppers: one pod that checks out 5 times a second, so there are
# requests that can fail. The same image as the shop, run as `shopper`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopper
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: shopper}
  template:
    metadata:
      labels: {app: shopper}
      annotations:
        demo.flagbreaker.dev/image-id: "__APP_IMAGE_ID__"
    spec:
      containers:
        - name: shopper
          image: checkout-demo:dev
          imagePullPolicy: IfNotPresent
          args: [shopper]
          env:
            - {name: SHOP_URL, value: "http://checkout.shop.svc.cluster.local/"}
            - {name: SHOPPER_RATE, value: "5"}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
---
# new_payments breaks the shop without crashing it: payments fail with HTTP
# 500 while every pod stays up and ready. So this guard also reads the
# requests: Flagbreaker reads http_requests_total from each checkout pod on
# port 8080, and trips when more than 5% of the checkouts fail with 5xx
# after the flag changes. Written by hand, so the guards made from the
# annotation above keep watching the pods only.
apiVersion: flagbreaker.dev/v1alpha1
kind: FlagGuard
metadata:
  name: checkout-new-payments
  namespace: shop
spec:
  flag: new_payments
  environmentKey: "__ENVIRONMENT_KEY__"
  workload:
    kind: Deployment
    name: checkout
  stableFor: 20s
  requests:
    port: 8080
    metric: http_requests_total
    maxErrorPercent: 5
  links:
    - title: Runbook
      url: https://github.com/Pradyuman-aviator/flagbreaker/blob/main/docs/runbook.md
