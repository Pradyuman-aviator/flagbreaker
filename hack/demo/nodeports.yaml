# The Flagsmith chart only creates ClusterIP Services. These two NodePort
# Services expose the API and the dashboard on fixed ports, which the kind
# cluster maps to localhost (see the kind config in hack/demo/up.sh).
apiVersion: v1
kind: Service
metadata:
  name: flagsmith-api-nodeport
  namespace: flagsmith
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: flagsmith
    app.kubernetes.io/instance: flagsmith
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: flagsmith-frontend-nodeport
  namespace: flagsmith
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: flagsmith
    app.kubernetes.io/instance: flagsmith
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
