# Push a tag such as v0.1.0 to publish:
#   ghcr.io/<owner>/flagbreaker:0.1.0      (linux/amd64 and linux/arm64)
#   ghcr.io/<owner>/checkout-demo:0.1.0    (the demo app)
#   oci://ghcr.io/<owner>/charts/flagbreaker, chart version 0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: names
        id: names
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile cross-compiles, so no emulation is needed for arm64.
      - name: controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.names.outputs.version }}
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/flagbreaker:${{ steps.names.outputs.version }}
            ghcr.io/${{ steps.names.outputs.owner }}/flagbreaker:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: demo app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CMD=./demo/checkout
          tags: ghcr.io/${{ steps.names.outputs.owner }}/checkout-demo:${{ steps.names.outputs.version }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: chart
        env:
          OWNER: ${{ steps.names.outputs.owner }}
          VERSION: ${{ steps.names.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash hack/tools.sh
          bin/helm package charts/flagbreaker --version "$VERSION" --app-version "$VERSION" --destination dist
          echo "$TOKEN" | bin/helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bin/helm push "dist/flagbreaker-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"
